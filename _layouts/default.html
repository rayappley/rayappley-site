{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
{% include head.html %}
</head>
<body>
<a class="skip-link" href="#main">{{ t.skip }}</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
{% if site.launched %}<!-- Cloudflare Web Analytics: cookieless visitor counts -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "cb8f5aab8b6044c9b8c7c731f186424c"}'></script>
